# Dónde Volar — home server stack (Portainer)
#
# Public HTTPS: Nginx Proxy Manager → API (see README).
# Default API port 9080 (host + container) — avoids conflict with other services on 8080.
# Optional: docker-compose.override.yml to join your nginx Docker network.

name: dondevolar

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dondevolar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in stack environment}
      POSTGRES_DB: ${POSTGRES_DB:-dondevolar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dondevolar} -d ${POSTGRES_DB:-dondevolar}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in stack environment}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in stack environment}
    volumes:
      - minio_data:/data

  photon:
    image: ghcr.io/rtuszik/photon-docker:latest
    restart: unless-stopped
    environment:
      REGION: argentina
      UPDATE_STRATEGY: SEQUENTIAL
      UPDATE_INTERVAL: 720h
    volumes:
      - photon_data:/photon/data

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: dondevolar-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      photon:
        condition: service_started
    environment:
      APP_ENV: production
      PORT: ${API_PORT:-9080}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-dondevolar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dondevolar}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Portainer stack environment}
      PHOTON_BASE_URL: http://photon:2322
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
      OPENAIP_API_KEY: ${OPENAIP_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      ZONE_FEED_PATH: /app/data/zones.geojson
    # Zone feed is baked into the API image (feed/zones.geojson at build time).
    # Omit ports when NPM uses the shared Docker network (dondevolar-api:9080).
    # For NPM via host LAN IP, publish on all interfaces (not 127.0.0.1).
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-9080}:${API_PORT:-9080}"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  photon_data:
