# Include from your nginx container (e.g. mount into /etc/nginx/conf.d/).
# TLS certificates: use your existing certbot / acme setup for aquiles.dev.
#
# Choose ONE upstream block:
#   A) nginx on the same Docker network as dondevolar-api (recommended)
#   B) nginx on the host proxying to the published loopback port

# --- A) Same Docker network (container_name: dondevolar-api) ---
upstream dondevolar_api {
    server dondevolar-api:8080;
    keepalive 8;
}

# --- B) Host loopback (default API_HOST_PORT=127.0.0.1:18080) ---
# upstream dondevolar_api {
#     server 127.0.0.1:18080;
#     keepalive 8;
# }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dondevolar.aquiles.dev;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://dondevolar_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dondevolar.aquiles.dev;
    return 301 https://$host$request_uri;
}
