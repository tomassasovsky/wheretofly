name: where_to_fly
description: >-
  Dónde Volar — an app to check where you can and cannot fly a drone in
  Argentina, based on ANAC regulations (Res. 550/2025 / RAAC 100) and the
  permissions you hold.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  argentina_bounds:
    path: packages/argentina_bounds
  auth_api_client:
    path: packages/auth_api_client
  auth_repository:
    path: packages/auth_repository
  backend_zones_api_client:
    path: packages/backend_zones_api_client
  bloc: ^8.1.4
  equatable: ^2.0.5
  flight_rules_repository:
    path: packages/flight_rules_repository
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  flutter_map: ^7.0.2
  geocoding_api_client:
    path: packages/geocoding_api_client
  geocoding_repository:
    path: packages/geocoding_repository
  go_router: ^16.3.0
  go_router_guards: ^2.0.0+2
  http: ^1.2.2
  intl: any
  latlong2: ^0.9.1
  location_repository:
    path: packages/location_repository
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  messaging_api_client:
    path: packages/messaging_api_client
  messaging_repository:
    path: packages/messaging_repository
  settings_repository:
    path: packages/settings_repository
  social_api_client:
    path: packages/social_api_client
  social_repository:
    path: packages/social_repository
  storage:
    path: packages/storage
  url_launcher: ^6.3.2
  wasm_run: ^0.1.0+2
  wasm_run_flutter: ^0.1.0
  weather_api_client:
    path: packages/weather_api_client
  weather_repository:
    path: packages/weather_repository
  zones_api_client:
    path: packages/zones_api_client

# Migrated Android impl (built-in Kotlin DSL, no kotlin-android plugin).
dependency_overrides:
  shared_preferences_android: 2.4.25

dev_dependencies:
  bloc_test: ^9.1.7
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.3.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  shared_preferences: ^2.5.3
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/om/om_reader_wasm.wasm
    - assets/om/om_reader_wasm_wasmi.wasm

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#091020"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#091020"
  image: assets/icon/app_icon_foreground.png
  android_12:
    color: "#091020"
    image: assets/icon/app_icon_foreground.png
  android: true
  ios: true
