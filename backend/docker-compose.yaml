services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dondevolar
      POSTGRES_PASSWORD: dondevolar
      POSTGRES_DB: dondevolar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dondevolar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  photon:
    image: ghcr.io/rtuszik/photon-docker:latest
    environment:
      REGION: argentina
      UPDATE_STRATEGY: SEQUENTIAL
      UPDATE_INTERVAL: 720h
    volumes:
      - photon_data:/photon/data
    ports:
      - "2322:2322"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      photon:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: dondevolar
      POSTGRES_PASSWORD: dondevolar
      POSTGRES_DB: dondevolar
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PHOTON_BASE_URL: http://photon:2322
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: media
      ZONE_FEED_PATH: /app/data/zones.geojson
    volumes:
      - ../feed/zones.geojson:/app/data/zones.geojson:ro
    ports:
      - "8080:8080"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  minio_data:
  photon_data:
  caddy_data:
  caddy_config:
