name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test app
        run: flutter test

      - name: Test packages
        run: |
          for pkg in packages/*/; do
            if [ -f "${pkg}pubspec.yaml" ] && [ -d "${pkg}test" ]; then
              echo "Testing ${pkg}"
              (cd "$pkg" && dart pub get && dart test)
            fi
          done
