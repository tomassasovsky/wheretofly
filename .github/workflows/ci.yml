name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Set up wasm_run native library
        run: dart run wasm_run:setup

      - name: Analyze
        run: flutter analyze

      - name: Test app
        run: flutter test

      - name: Test backend
        run: |
          cd backend
          dart pub get
          dart test

      - name: Test packages
        run: |
          package_needs_flutter_test() {
            local spec="$1/pubspec.yaml"
            grep -qE 'sdk:[[:space:]]*flutter|^[[:space:]]*flutter:[[:space:]]*$' "$spec" && return 0
            grep -qE '^[[:space:]]+storage:' "$spec" && return 0
            grep -qE '^[[:space:]]+location_client:' "$spec" && return 0
            return 1
          }
          for pkg in packages/*/; do
            if [ -f "${pkg}pubspec.yaml" ] && [ -d "${pkg}test" ]; then
              echo "Testing ${pkg}"
              if package_needs_flutter_test "$pkg"; then
                (cd "$pkg" && flutter pub get && flutter test)
              else
                (cd "$pkg" && dart pub get && dart test)
              fi
            fi
          done
